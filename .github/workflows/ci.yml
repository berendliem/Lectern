name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A throwaway database: the build prerenders pages that open the Prisma
      # client at module load, and migrate deploy proves the migrations apply
      # cleanly to an empty file.
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Committed Prisma client matches the schema
        run: |
          npx prisma generate
          git diff --exit-code --stat src/generated
      - name: Migrations apply to an empty database
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
